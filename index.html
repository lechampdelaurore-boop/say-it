<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say it!</title>
<meta name="description" content="Les couleurs et les vêtements en anglais, comme sur la fiche de la classe : on dit le mot à voix haute, on soulève la tache, on écoute. 5 minutes par jour.">
<meta name="theme-color" content="#FFF4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1933" media="(prefers-color-scheme: dark)">
<meta name="appli-marc" content="oui">
<meta name="appli-theme" content="anglais">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Say it!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==========================================================================
   Charte commune des applis — v1 (1er novembre 2026)
   À coller en haut du <style> de chaque index.html (pas de fichier externe :
   chaque appli reste un seul index.html). Voir charte.md pour les règles.
   Polices : copier design/fonts/ dans le dossier fonts/ de l'appli.
   ========================================================================== */

@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('fonts/fredoka-latin.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }

/* ---------- 1. Jetons (couleurs, formes, polices) ---------- */
:root {
  color-scheme: light dark;

  /* Fond et surfaces */
  --bg: #FFF4FA;            /* haut du dégradé de fond (rose très pâle) */
  --bg2: #EEF4FF;           /* bas du dégradé (bleu très pâle) */
  --surface: #FFFFFF;       /* cartes, bulles, boutons doux */
  --surface2: #F4F1FF;      /* touches du clavier, zones calmes */
  --track: #E4DEF7;         /* fond des barres de progression */

  /* Encre : même violet nuit que le contour des 30 personnages */
  --ink: #2B2340;           /* texte */
  --muted: #6B6190;         /* texte secondaire */
  --line: #2B2340;          /* contours et ombres dures */

  /* Rôles de couleur (un rôle = une couleur, dans toutes les applis) */
  --action: #3B5BFF;        /* LE bouton principal (Commencer, Valider, Suivant) */
  --on-action: #FFFFFF;
  --pompon: #FF6FA5;        /* rose de Pompon : cœurs, « Nouveau », bouton ▶ de l'accueil */
  --on-pompon: #FFFFFF;
  --sun: #FFD45C;           /* étoiles, récompenses, astuces, focus clavier */
  --on-sun: #2B2340;
  --good: #2BC48A;          /* bonne réponse, OK */
  --on-good: #0B2E20;
  --tint-good: #D8F6E8;     /* carte réussie */
  --retry: #FFB38A;         /* « à retenter » (jamais de rouge) */
  --tint-retry: #FFE4D6;    /* carte à retenter */

  /* 6 pastels (pastilles A-F, cartes de l'accueil, zones de carte) */
  --p-rose: #FFD2E3;
  --p-soleil: #FFE9A3;
  --p-menthe: #C6F1E2;
  --p-lilas: #E0D6FF;
  --p-ciel: #CDEBFF;
  --p-peche: #FFDCC8;

  /* 6 couleurs vives (icônes, personnages, confettis) */
  --v-rose: #FF6FA5;
  --v-soleil: #FFD45C;
  --v-menthe: #8EE3C8;
  --v-lilas: #C9B6FF;
  --v-ciel: #9AD7FF;
  --v-peche: #FFB38A;

  /* Lecture (applis de français) */
  --syl-a: #2F4FE0;         /* syllabes alternées : bleu… */
  --syl-b: #C92A62;         /* …et framboise */
  --muette: #A39DB8;        /* lettre muette grisée */
  --son-cle: #FFE9A3;       /* fond de la lettre qui décide du son */
  --ligne-b: #EEF1FF;       /* une ligne sur deux */

  /* Polices */
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;  /* titres, boutons, chiffres */
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; /* texte */
  --lecture: 'Nunito', Arial, sans-serif;                        /* texte à lire */

  /* Formes */
  --bord: 3px;
  --r-carte: 28px;
  --r-btn: 22px;
  --r-touche: 18px;
  --r-pastille: 999px;
  --ombre: 0 5px 0 var(--line);
  --ombre-carte: 0 6px 0 var(--line);
  --toucher: 56px;          /* hauteur mini d'un bouton */

  /* Mouvement */
  --ressort: cubic-bezier(.3, 1.6, .5, 1);
  --deco: .55;              /* opacité des petits dessins de fond */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1933;
    --bg2: #171B36;
    --surface: #2B2448;
    --surface2: #352D57;
    --track: #3D3466;
    --ink: #FBEFFF;
    --muted: #C3B7E8;
    --line: #120E22;        /* le contour reste sombre, même la nuit */
    --action: #7F98FF;
    --on-action: #120E22;
    --pompon: #FF8DB9;
    --on-pompon: #2A0F1E;
    --good: #3DDC97;
    --tint-good: #1D4A3D;
    --retry: #FF9F7A;
    --tint-retry: #5A3326;
    --p-rose: #5A3552;
    --p-soleil: #5A4A24;
    --p-menthe: #24504A;
    --p-lilas: #433A72;
    --p-ciel: #283F68;
    --p-peche: #5A3A2E;
    --syl-a: #9DB0FF;
    --syl-b: #FF8DB4;
    --muette: #7D7499;
    --son-cle: #5A4A24;
    --ligne-b: #262046;
    --deco: .25;
  }
}

/* ---------- 2. Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg2); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
h2 { font-size: 1.4rem; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 3. En-tête commun : 🏠 · titre · ⚙ ---------- */
.entete { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.entete .titre { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center; }
.rond {                    /* bouton rond (🏠, ⚙, ✕, son) */
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.rond:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 4. Boutons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: var(--toucher); padding: 10px 22px;
  font: 600 1.2rem var(--display); text-decoration: none;
  color: var(--ink); background: var(--surface);
  border: var(--bord) solid var(--line); border-radius: var(--r-btn);
  box-shadow: var(--ombre); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--ombre); }
.btn-action { background: var(--action); color: var(--on-action); }   /* un seul par écran */
.btn-soleil { background: var(--sun); color: var(--on-sun); }         /* bonus, installer */
.btn-ok { background: var(--good); color: var(--on-good); }
.btn-petit { width: auto; min-height: 44px; padding: 6px 16px; font-size: 1rem; border-radius: var(--r-pastille); box-shadow: 0 4px 0 var(--line); }

/* ---------- 5. Cartes, bulles, pastilles ---------- */
.carte {
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 20px;
}
.carte.reussie { background: var(--tint-good); }
.carte.a-retenter { background: var(--tint-retry); }
.bulle {                   /* bulle de dialogue d'un personnage */
  position: relative; background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: 26px; box-shadow: var(--ombre); padding: 12px 16px;
}
.pastille {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px;
  border: 2px solid var(--line); border-radius: var(--r-pastille);
  background: var(--surface); font: 700 .9rem var(--body); white-space: nowrap;
}
.pastille.soleil { background: var(--p-soleil); }
.pastille.rose { background: var(--p-rose); }
.pastille.menthe { background: var(--p-menthe); }
.badge-nouveau {
  display: inline-block; background: var(--sun); color: var(--on-sun);
  border: var(--bord) solid var(--line); border-radius: var(--r-pastille);
  padding: 1px 10px 2px; font: 700 .85rem var(--display); transform: rotate(4deg);
}
.etiquette { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.astuce {
  background: var(--sun); color: var(--on-sun); border-radius: 18px;
  padding: 10px 14px; font-weight: 700;
}
.astuce::before { content: '💡 '; }

/* ---------- 6. Progression ---------- */
.barre { height: 18px; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); overflow: hidden; }
.barre > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: inherit; transition: width .4s var(--ressort); }

/* ---------- 7. Choix A-F (QCM) et clavier ---------- */
.choix {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--toucher);
  padding: 8px 14px; text-align: left; font: 600 1.1rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.choix:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choix .lettre {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 10px; font-size: .9rem; background: var(--p-lilas);
}
.choix:nth-child(6n+1) .lettre { background: var(--p-rose); }
.choix:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.choix:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.choix:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.choix:nth-child(6n+5) .lettre { background: var(--p-peche); }
.choix:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.choix.bon { background: var(--tint-good); }
.choix.a-revoir { background: var(--tint-retry); }
.touche {
  min-height: 64px; font: 600 1.8rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.touche.douce { background: var(--surface2); }
.touche.ok { background: var(--good); color: var(--on-good); }

/* ---------- 8. Réglages : interrupteur ---------- */
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toucher); font-weight: 700; cursor: pointer; }
.interrupteur input { appearance: none; flex: none; width: 58px; height: 34px; margin: 0; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); position: relative; cursor: pointer; transition: background .2s; }
.interrupteur input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: transform .2s var(--ressort); }
.interrupteur input:checked { background: var(--good); }
.interrupteur input:checked::after { transform: translateX(24px); }

/* ---------- 9. Texte à lire (applis de français) ---------- */
.texte-lecture {
  font-family: var(--lecture); font-size: 22px; font-weight: 600; line-height: 2;
  letter-spacing: .02em; word-spacing: .12em; max-width: 34ch;
}
.texte-lecture .ligne { display: block; padding: 0 10px; border-radius: 10px; }
.texte-lecture .ligne:nth-child(even) { background: var(--ligne-b); }
.syl-a { color: var(--syl-a); }
.syl-b { color: var(--syl-b); }
.muette { color: var(--muette); }
.son-cle { background: var(--son-cle); border-radius: 6px; box-shadow: 0 0 0 2px var(--son-cle); }

/* ---------- 10. Animations (désactivables) ---------- */
@keyframes apparait { from { transform: scale(.85); opacity: 0; } }
@keyframes bravo { 0% { transform: scale(1); } 30% { transform: scale(1.08) rotate(-2deg); } 55% { transform: scale(.97) rotate(1deg); } 80% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes non { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(3px) rotate(.5deg); } }
@keyframes saute { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.06, .94); } 82% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes flotte { 50% { transform: translateY(-12px) rotate(12deg); } }
@keyframes etoile { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -80px)) scale(1) rotate(160deg); opacity: 0; } }
@keyframes arrive { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 60% { transform: translateY(-8px) scale(1.05); opacity: 1; } 100% { transform: none; } }

.anim-apparait { animation: apparait .45s var(--ressort) both; }
.anim-bravo { animation: bravo .6s ease both; }          /* bonne réponse : la carte rebondit */
.anim-non { animation: non .5s ease both; }              /* erreur : la carte secoue la tête */
.anim-saute { animation: saute 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.anim-arrive { animation: arrive .7s var(--ressort) both; } /* entrée d'un personnage */

/* Petits dessins de fond ★ ♥ ✿ ✦ */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--deco); }
.deco span { position: absolute; font-size: 22px; animation: flotte 7s ease-in-out infinite; }

/* Interrupteur « Animations » de l'appli : <html class="calme"> */
.calme *, .calme *::before, .calme *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   Say it! : styles propres à l'appli
   ========================================================================== */
:root { --papier: #FFFBF3; --papier-bord: #2B2340; }
@media (prefers-color-scheme: dark) { :root { --papier: #F3EEFF; } }
.wrap { position: relative; z-index: 1; }
body.jeu .wrap { height: 100dvh; display: flex; flex-direction: column; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
body.jeu .entete { margin-bottom: 6px; }
body.jeu .entete .rond { width: 42px; height: 42px; font-size: 19px; }
body.jeu .deco { display: none; }
.vue { animation: apparait .35s var(--ressort) both; }
.pile { display: grid; gap: 14px; }
.centre { text-align: center; }
.muted { color: var(--muted); }
.petit { font-size: .95rem; }
p { margin: 0; }
.lien { background: none; border: 0; color: var(--muted); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 10px; justify-self: center; min-height: 44px; font-family: var(--body); font-size: 1rem; }
.ligne-btn { display: flex; gap: 10px; }
.ligne-btn > .btn { flex: 1; padding-left: 10px; padding-right: 10px; }
.en { font-family: var(--display); font-weight: 600; }
svg.dessin { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Accueil ---------- */
.bonjour { font: 700 1.5rem var(--display); }
.sous-btn { text-align: center; color: var(--muted); font-weight: 800; margin-top: -6px; }
.btn-jour { min-height: 68px; font-size: 1.35rem; }
.fiches { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tuile {
  position: relative; display: grid; gap: 4px; justify-items: center; min-height: 128px; padding: 10px 10px 12px; cursor: pointer; text-align: center;
  border: var(--bord) solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: var(--p-ciel); color: var(--ink); font-family: var(--body);
}
.tuile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tuile.clothes { background: var(--p-menthe); }
.tuile .em { font-size: 2rem; line-height: 1; }
.tuile .tt { font: 700 1.25rem/1.1 var(--display); }
.tuile .st { font: 800 .85rem var(--body); color: var(--muted); }
.tuile .barre { width: 100%; height: 12px; border-width: 2px; }
.carte-lien { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; padding: 12px 14px; font-family: var(--body); color: var(--ink); position: relative; }
.carte-lien:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.carte-lien .em { font-size: 1.8rem; flex: none; }
.carte-lien .tt { display: block; font: 700 1.15rem var(--display); }
.carte-lien .st { display: block; font-size: .92rem; color: var(--muted); font-weight: 700; }
.carte-lien.bonus { background: var(--p-soleil); }
.carte-lien .badge-nouveau { position: absolute; top: -12px; right: 10px; }
.avis { background: var(--p-peche); border: 2px solid var(--line); border-radius: 18px; padding: 8px 12px; font-weight: 700; font-size: .95rem; }

/* ---------- Une case : dessin + mot caché sous une tache ---------- */
.case {
  position: relative; display: grid; grid-template-rows: 1fr auto; padding: 0; cursor: pointer; overflow: visible;
  background: var(--papier); color: #2B2340; border: var(--bord) solid var(--line); border-radius: 20px; box-shadow: 0 4px 0 var(--line);
  font-family: var(--display); -webkit-tap-highlight-color: transparent;
}
.case:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.case .img { position: relative; min-height: 0; padding: 6%; }
.case .mot { visibility: hidden; opacity: 0; font: 600 1.05rem/1.1 var(--display); padding: 0 4px 8px; text-align: center; min-height: 1.6em; }
.case .fr { display: block; font: 700 .75rem var(--body); color: #6B6190; }
.case .rabat { position: absolute; pointer-events: none; transition: transform .55s var(--ressort); transform-origin: 85% 15%; }
/* Colors : la tache couvre tout, le mot est dessous */
.case.couleur { grid-template-rows: 1fr; }
.case.couleur .rabat { inset: 8%; }
.case.couleur .mot { position: absolute; inset: 0; display: grid; place-content: center; padding: 4px; font-size: 1.15rem; }
.case.couleur.leve .rabat { transform: rotate(20deg) scale(.34); }
/* Clothes : le dessin, et le mot sous une tache claire posée dessus comme un rabat */
.case .bande { position: relative; display: grid; }
.case.habit .rabat {
  left: 6%; right: 8%; top: -2px; bottom: 6px; background: #EDE7FA; border: var(--bord) solid #2B2340;
  border-radius: 48% 52% 44% 56% / 62% 46% 54% 38%; box-shadow: inset -5px -4px 0 #D6CCF2; transition: transform .5s var(--ressort), opacity .45s ease;
}
.case.habit .rabat::after { content: ''; position: absolute; right: -11px; top: -7px; width: 9px; height: 9px; border-radius: 50%; background: #EDE7FA; border: 2.5px solid #2B2340; }
.case.habit .rabat::before { content: ''; position: absolute; left: 16%; top: 22%; width: 18%; height: 18%; border-radius: 50%; background: #fff; opacity: .7; }
.case.habit.leve .rabat { transform: translate(30%, -70%) rotate(25deg) scale(.45); opacity: 0; }
.case.leve .mot { visibility: visible; opacity: 1; transition: opacity .3s .15s; }
.case.dis::after { content: '🗣️ Dis-le !'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; white-space: nowrap;
  background: var(--sun); color: var(--on-sun); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font: 700 .9rem var(--display); }

/* ---------- La fiche ---------- */
.question { display: flex; align-items: center; gap: 8px; }
.question .txt { flex: 1; min-width: 0; font: 700 1.25rem/1.15 var(--display); }
.question .rond { width: 46px; height: 46px; font-size: 20px; }
.grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grille .case { aspect-ratio: 1 / 1.12; }
.grille .case.couleur { aspect-ratio: 1 / 1; }
@media (min-width: 520px) { .grille { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 760px) { .wrap.large { max-width: 900px; } .grille { grid-template-columns: repeat(6, 1fr); } }

/* ---------- Écran d'exercice ---------- */
.vjeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.haut-jeu { display: flex; align-items: center; gap: 10px; }
.haut-jeu .barre { flex: 1; height: 14px; border-width: 2px; }
.haut-jeu .compte { font: 700 .95rem var(--display); color: var(--muted); }
.haut-jeu .score { font: 700 1rem var(--display); white-space: nowrap; }
.zone { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.consigne { text-align: center; font-weight: 800; min-height: 1.4em; }
.retour-msg { text-align: center; min-height: 2.6em; display: grid; align-content: center; gap: 0; }
.retour-msg .phrase { font: 700 1.25rem/1.2 var(--display); }
.retour-msg .fr { font-size: .9rem; color: var(--muted); font-weight: 700; }
.bas { display: grid; gap: 8px; }
.grand { flex: 1; min-height: 0; display: flex; justify-content: center; }
.grand .case { height: 100%; max-height: 300px; aspect-ratio: 1 / 1.15; width: auto; max-width: 100%; cursor: default; }
.grand .case.couleur { aspect-ratio: 1 / 1; }
.grand .case:active { transform: none; box-shadow: 0 4px 0 var(--line); }
.grand .case .mot { font-size: clamp(1.3rem, 6vw, 1.9rem); }
.grand .case .fr { font-size: .95rem; }
.quatre { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
.quatre .img-btn, .deux .img-btn { min-height: 0; }
.quatre .case, .quatre .case.couleur { aspect-ratio: auto; min-height: 0; height: 100%; }
.quatre .case .img { overflow: hidden; }
.img-btn {
  position: relative; padding: 6px; cursor: pointer; background: var(--papier); border: var(--bord) solid var(--line); border-radius: 20px;
  box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
}
.img-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.img-btn svg { width: 100%; height: 100%; max-height: 100%; }
.img-btn.bon { background: var(--tint-good); box-shadow: 0 0 0 5px var(--good), 0 4px 0 var(--line); }
.img-btn.a-revoir { background: var(--tint-retry); }
.img-btn.eteint { opacity: .45; }
.img-btn .lab { position: absolute; left: 4px; right: 4px; bottom: 4px; font: 600 1rem var(--display); color: #2B2340; text-align: center; }
.image-seule { flex: 1; min-height: 0; display: flex; justify-content: center; }
.image-seule .cadre { height: 100%; max-height: 220px; aspect-ratio: 1; background: var(--papier); border: var(--bord) solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); padding: 4%; }
.mots4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mots4 .choix { justify-content: center; text-align: center; min-height: 56px; padding: 6px 8px; font-size: 1.15rem; }
.deux { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
.deux .img-btn { aspect-ratio: 1; max-height: 100%; }
.points-j { display: flex; justify-content: center; gap: 8px; }
.points-j i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.points-j i.ok { background: var(--good); }
.points-j i.ko { background: var(--retry); }
.points-j i.ici { background: var(--sun); }
.lever-btn { position: relative; overflow: hidden; }
.lever-btn .attente { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--sun); transform-origin: left; animation: attente 2s linear both; }
@keyframes attente { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.zone.reussi .case, .zone.reussi .cadre { background: var(--tint-good); }
.zone.rate .cadre { background: var(--tint-retry); }

/* ---------- Bonus ---------- */
.etiquettes { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 52px; }
.ligne-rep { min-height: 62px; padding: 6px; border: 3px dashed var(--muted); border-radius: 18px; background: var(--surface); align-content: center; }
.etiq {
  min-height: 46px; padding: 4px 14px; font: 600 1.15rem var(--display); color: var(--ink); cursor: pointer;
  background: var(--p-lilas); border: var(--bord) solid var(--line); border-radius: 14px; box-shadow: 0 3px 0 var(--line);
}
.etiq:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.ligne-rep .etiq { background: var(--p-ciel); }
.etiq.bien { background: var(--tint-good); }
.etiq.mal { background: var(--tint-retry); }
.trois { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: center; }
.trois .img-btn { aspect-ratio: 100 / 140; max-height: 100%; padding: 4px; }
.lecon-ex { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 2px solid var(--line); border-radius: 18px; padding: 8px 10px; }
.lecon-ex .en { flex: 1; font-size: 1.2rem; }
.lecon-ex .rond { width: 44px; height: 44px; font-size: 18px; }
.lecon-ex svg { width: 56px; height: 56px; flex: none; background: var(--papier); border: 2px solid var(--line); border-radius: 12px; padding: 2px; }
.cap-grand { width: 120px; height: 120px; justify-self: center; background: var(--papier); border: var(--bord) solid var(--line); border-radius: 22px; padding: 8px; }
.regle { font-size: 1.1rem; line-height: 1.45; }
.regle b { font-family: var(--display); }

/* ---------- Fin, coin des parents ---------- */
.recompense { display: grid; justify-items: center; gap: 10px; text-align: center; }
.recompense svg { width: clamp(90px, 22vh, 150px); height: clamp(90px, 22vh, 150px); overflow: visible; }
.recompense .bras { transform-box: view-box; animation: coucou 2.6s ease-in-out infinite; }
.recompense .yeux { transform-box: view-box; animation: cligne 4s infinite; }
.recompense .gros { font: 700 1.6rem var(--display); }
@keyframes coucou { 0%, 55%, 100% { transform: rotate(0); } 65% { transform: rotate(-22deg); } 75% { transform: rotate(8deg); } 85% { transform: rotate(-18deg); } 93% { transform: rotate(4deg); } }
@keyframes cligne { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.etoile-vole { position: fixed; z-index: 30; font-size: 26px; pointer-events: none; animation: etoile 1s ease-out forwards; }
.liste-mots { display: grid; gap: 6px; }
.liste-mots .lm { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.liste-mots .lm .en { flex: 1; }
.liste-mots .lm .d { color: var(--muted); font-size: .85rem; }
.boites { display: inline-flex; gap: 3px; }
.boites i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.boites i.p { background: var(--good); }
.tab7 { width: 100%; border-collapse: collapse; font-weight: 700; }
.tab7 td, .tab7 th { padding: 4px 6px; text-align: center; border-bottom: 2px solid var(--track); }
.tab7 th { font: 700 .85rem var(--display); color: var(--muted); }
h3.sec { font-size: 1.15rem; margin-top: 4px; }

/* ---------- Dialogues ---------- */
dialog { width: min(92vw, 440px); max-height: 90dvh; overflow: auto; background: var(--surface); color: var(--ink); border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 18px; }
dialog::backdrop { background: rgba(30, 25, 51, .55); }
dialog h2 { margin-bottom: 8px; }
.sep-ligne { border: 0; border-top: 2px dashed var(--track); margin: 8px 0; }
.reglage-titre { font-weight: 800; margin-top: 6px; }
select.voix { width: 100%; min-height: 48px; border: var(--bord) solid var(--line); border-radius: 14px; background: var(--surface2); padding: 6px 10px; font-weight: 700; }

/* ---------- Petits écrans ---------- */
@media (max-height: 620px) {
  body.jeu .wrap { padding-top: max(6px, env(safe-area-inset-top)); }
  body.jeu .entete .rond { width: 38px; height: 38px; font-size: 17px; }
  body.jeu .entete .titre { font-size: 1.1rem; }
  .vjeu { gap: 6px; }
  .question .txt { font-size: 1.1rem; }
  .question .rond { width: 42px; height: 42px; font-size: 18px; }
  .btn { font-size: 1.1rem; }
  .retour-msg { min-height: 2.3em; }
  .retour-msg .phrase { font-size: 1.1rem; }
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span style="left:6%;top:12%">✿</span><span style="right:8%;top:30%;animation-delay:-2s">★</span><span style="left:10%;bottom:16%;animation-delay:-4s">♥</span><span style="right:12%;bottom:8%;animation-delay:-1s">✦</span></div>
<div class="wrap" id="wrap">
  <header class="entete">
    <a class="rond" id="bMaison" href="/" aria-label="Mes applis" title="Mes applis">🏠</a>
    <button class="rond" id="bRetour" type="button" aria-label="Revenir" title="Revenir" hidden>✕</button>
    <div class="titre" id="titreEntete">Say it!</div>
    <button class="rond" id="bReglages" type="button" aria-label="Réglages" title="Réglages">⚙</button>
  </header>

  <!-- Accueil -->
  <main id="vAccueil" class="vue pile"></main>
  <!-- La fiche (comme en classe) -->
  <main id="vFiche" class="vue pile" hidden></main>
  <!-- Une carte (séance du jour, tour de la fiche, bonus) -->
  <main id="vJeu" class="vue vjeu" hidden>
    <div class="haut-jeu"><div class="barre" aria-hidden="true"><i id="jAvance"></i></div><span class="compte" id="jCompte"></span><span class="score" id="jScore"></span></div>
    <div class="question" id="jQuestion"></div>
    <div class="zone" id="jZone"></div>
    <div class="retour-msg" id="jMsg" aria-live="polite"></div>
    <div class="bas" id="jBas"></div>
  </main>
  <!-- Bravo -->
  <main id="vFin" class="vue pile" hidden></main>
  <!-- Bonus « Je m'habille » -->
  <main id="vBonus" class="vue pile" hidden></main>
  <!-- Mini-leçon du bonus -->
  <main id="vLecon" class="vue pile" hidden></main>
  <!-- Coin des parents -->
  <main id="vParent" class="vue pile" hidden></main>
</div>

<dialog id="dReglages">
  <h2>⚙ Réglages</h2>
  <label class="interrupteur">🎵 Sons<input type="checkbox" id="rSon"></label>
  <label class="interrupteur">✨ Animations<input type="checkbox" id="rAnim"></label>
  <hr class="sep-ligne">
  <label class="interrupteur">🐢 Voix lente<input type="checkbox" id="rLente"></label>
  <label class="interrupteur">💬 Le français après la réponse<input type="checkbox" id="rFrancais"></label>
  <div class="reglage-titre">Voix anglaise</div>
  <select class="voix" id="rVoix" aria-label="Voix anglaise"></select>
  <p class="muted petit" id="rVoixInfo" style="margin-top:6px"></p>
  <button class="btn btn-petit" id="rTester" type="button" style="margin-top:8px">🔊 Tester la voix</button>
  <hr class="sep-ligne">
  <p class="muted petit">Les progrès restent sur cet appareil. Seul un compteur anonyme compte les visites, sans nom ni cookie. Pas de micro.</p>
  <button class="btn btn-action" id="rFermer" type="button" style="margin-top:12px">Fermer</button>
</dialog>

<dialog id="dConfirme">
  <h2 id="cTitre">Tout recommencer ?</h2>
  <p id="cTexte" style="margin-bottom:14px"></p>
  <div class="ligne-btn"><button class="btn" id="cNon" type="button">Non</button><button class="btn btn-action" id="cOui" type="button">Oui</button></div>
</dialog>

<script>
/* Dessins de « Say it! » : 13 vêtements coloriables + 12 taches de peinture.
   viewBox 100 × 100, contour commun #2B2340 ajouté par l'appelant :
   '<g stroke="#2B2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">' + dessin + '</g>'
   Même style que les 30 créatures : forme ombrée en bas à droite, petit reflet blanc en haut à gauche. */
(function (G) {
  var INK = '#2B2340', n = 0;
  function S(shape, base, shade, d) {
    var id = 'sv' + (++n); d = d == null ? 3 : d;
    return '<clipPath id="' + id + '"><' + shape + '/></clipPath>' +
      '<g clip-path="url(#' + id + ')" stroke="none"><' + shape + ' fill="' + shade + '"/>' +
      '<g transform="translate(' + -d + ' ' + -d + ')"><' + shape + ' fill="' + base + '"/></g></g><' + shape + ' fill="none"/>';
  }
  function P(d) { return 'path d="' + d + '"'; }
  function hi(x, y, rx, ry, rot) {
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" fill="#fff" opacity=".6" stroke="none"' +
      (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + '/>';
  }
  function ground(rx, y) { return '<ellipse cx="50" cy="' + (y || 94) + '" rx="' + (rx || 30) + '" ry="3" fill="' + INK + '" opacity=".14" stroke="none"/>'; }
  // Couleur plus foncée (ombre) ou plus claire (bandes, semelles) à partir de la couleur de base.
  function mix(c, m, t) {
    var a = parseInt(c.slice(1), 16), b = parseInt(m.slice(1), 16), r = '#';
    [16, 8, 0].forEach(function (s) {
      var v = Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
      r += ('0' + v.toString(16)).slice(-2);
    });
    return r;
  }
  function dk(c) { return mix(c, INK, .22); }
  function lt(c) { return mix(c, '#FFFFFF', .45); }
  function fine(d, w) { return '<path d="' + d + '" fill="none" stroke-width="' + (w || 1.6) + '"/>'; }
  function dot(x, y, r, c) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + c + '" stroke-width="1.6"/>'; }
  function both(s) { return s + '<g transform="matrix(-1 0 0 1 100 0)">' + s + '</g>'; }

  var V = {};

  // Casquette : calotte + visière, vue de côté.
  V.cap = function (c) {
    return ground(34, 76) +
      S(P('M58 62Q84 58 95 66Q93 73 80 73Q66 73 56 69z'), dk(c), mix(c, INK, .38), 2) +
      S(P('M14 66Q12 34 46 30Q74 30 78 60Q78 66 70 67Q42 70 14 66z'), c, dk(c)) +
      fine('M46 31Q40 46 42 68') + fine('M46 31Q58 44 62 67') +
      S(P('M14 66Q42 70 70 67L71 61Q42 64 14 60z'), lt(c), c, 1.5) +
      S('ellipse cx="46" cy="30" rx="5" ry="3"', lt(c), c, 1) +
      hi(28, 44, 6, 3, -40);
  };

  // Chaussures : une paire de baskets (semelle blanche, lacets).
  function shoe(x, y, c) {
    var t = 'translate(' + x + ' ' + y + ')';
    return '<g transform="' + t + '">' +
      S(P('M2 30V12Q2 6 9 6H20Q25 17 37 20L49 24Q58 27 58 35V38H2z'), c, dk(c)) +
      S(P('M0 36H60V41Q60 45 56 45H4Q0 45 0 41z'), '#FFFFFF', '#E4DEF7', 1.5) +
      fine('M22 13L29 10M26 17L33 14M31 20L37 17', 2) +
      S(P('M2 12Q2 6 9 6H12V30H2z'), lt(c), c, 1.2) +
      hi(36, 27, 6, 2.4, 15) + '</g>';
  }
  V.shoes = function (c) { return ground(42, 88) + shoe(34, 34, mix(c, INK, .1)) + shoe(6, 44, c); };

  // Chaussettes : une paire, bord côtelé, pas de semelle.
  function sock(x, y, c) {
    return '<g transform="translate(' + x + ' ' + y + ')">' +
      S(P('M0 12H22V48L40 57Q50 62 47 72Q44 81 34 78L9 68Q0 64 0 54z'), c, dk(c)) +
      S(P('M-1 0H23V13H-1z'), lt(c), c, 1.2) + fine('M5 2V11M11 2V11M17 2V11', 1.3) +
      S(P('M34 78Q44 81 47 72Q50 63 41 58Q36 66 34 78z'), lt(c), c, 1) +
      hi(6, 30, 2.4, 8) + '</g>';
  }
  V.socks = function (c) { return ground(36, 92) + sock(44, 8, mix(c, INK, .08)) + sock(18, 14, c); };

  // Manteau : long (sous les genoux), col large, gros boutons sur deux rangs.
  V.coat = function (c) {
    return ground(32, 96) +
      both(S(P('M33 12L18 24L10 76L22 78L30 40z'), c, dk(c))) +
      S(P('M33 12L42 8H58L67 12L74 92Q50 96 26 92z'), c, dk(c)) +
      both(S(P('M42 8L50 30L36 46L30 16z'), lt(c), c, 1.5)) +
      fine('M50 30V93') +
      dot(43, 52, 2.8, lt(c)) + dot(57, 52, 2.8, lt(c)) + dot(43, 66, 2.8, lt(c)) + dot(57, 66, 2.8, lt(c)) +
      dot(43, 80, 2.8, lt(c)) + dot(57, 80, 2.8, lt(c)) +
      both(fine('M10 70L22 72')) +
      hi(38, 58, 2.5, 9);
  };

  // Jupe : ceinture + jupe évasée, plis (pas de haut).
  V.skirt = function (c) {
    return ground(34, 86) +
      S(P('M32 34H68L84 76Q50 86 16 76z'), c, dk(c)) +
      fine('M40 35L32 80M50 35V84M60 35L68 80') +
      S(P('M31 26H69V35H31z'), lt(c), c, 1.2) +
      hi(38, 50, 2.5, 8, 15);
  };

  // Robe : haut à bretelles + jupe évasée, d'une seule pièce, petit nœud.
  V.dress = function (c) {
    return ground(34, 94) +
      both(S(P('M37 8H42L44 20L38 22z'), c, dk(c), 1.5)) +
      S(P('M36 20Q50 28 64 20Q68 34 62 46L82 88Q50 96 18 88L38 46Q32 34 36 20z'), c, dk(c)) +
      fine('M38 46Q50 50 62 46') + fine('M34 58L28 86M50 50V91M66 58L72 86') +
      S(P('M50 47L42 42V53z'), lt(c), c, 1) + S(P('M50 47L58 42V53z'), lt(c), c, 1) + dot(50, 47, 2.2, lt(c)) +
      hi(42, 32, 2.4, 6);
  };

  // Pantalon : deux jambes jusqu'aux pieds.
  V.trousers = function (c) {
    return ground(30, 96) +
      S(P('M27 15H73L78 92H56L50 38L44 92H22z'), c, dk(c)) +
      S(P('M27 8H73V16H27z'), lt(c), c, 1.2) +
      fine('M50 16V34') + fine('M30 17Q36 26 40 17') + fine('M70 17Q64 26 60 17') +
      fine('M22 86H44M56 86H78') +
      hi(31, 44, 2.4, 12, 4);
  };

  // Short : jambes au-dessus du genou (plus large que haut).
  V.shorts = function (c) {
    return ground(34, 82) +
      S(P('M24 36H76L84 74H56L50 54L44 74H16z'), c, dk(c)) +
      S(P('M24 28H76V37H24z'), lt(c), c, 1.2) +
      fine('M50 37V50') + fine('M28 38Q34 46 39 38') + fine('M72 38Q66 46 61 38') +
      fine('M17 68H44M56 68H83') +
      hi(29, 50, 2.2, 6, 8);
  };

  // T-shirt : manches courtes, col rond, sans boutons.
  V.tshirt = function (c) {
    return ground(30, 92) +
      S(P('M37 14Q50 24 63 14L86 26L78 44L68 39V88H32V39L22 44L14 26z'), c, dk(c)) +
      S(P('M37 14Q50 24 63 14L60 12Q50 19 40 12z'), lt(c), c, 1) +
      fine('M32 39V30M68 39V30', 1.4) +
      hi(38, 50, 2.5, 9);
  };

  // Chemise : manches longues avec poignets, col pointu, boutons, poche.
  V.shirt = function (c) {
    var L = lt(c);
    return ground(34, 94) +
      both(S(P('M35 13L20 22L10 74L21 76L30 42z'), c, dk(c))) +
      both(S(P('M10 70L21 72L20 78L9 76z'), L, c, 1)) +
      S(P('M35 13L50 20L65 13L70 42V90H30V42z'), c, dk(c)) +
      both(S(P('M35 12L50 20L42 30z'), L, c, 1)) +
      fine('M50 20V90') + dot(53, 34, 1.7, L) + dot(53, 47, 1.7, L) + dot(53, 60, 1.7, L) + dot(53, 73, 1.7, L) + dot(53, 85, 1.7, L) +
      S(P('M34 38H44V48Q39 51 34 48z'), L, c, 1) +
      hi(37, 60, 2.2, 8);
  };

  // Pull : manches longues, col rond côtelé, bas et poignets côtelés, motif tricot. Rien qui s'ouvre.
  V.jumper = function (c) {
    var L = lt(c);
    return ground(34, 94) +
      both(S(P('M33 16L18 26L10 72L22 74L30 44z'), c, dk(c))) +
      both(S(P('M10 68L22 70L21 78L9 76z'), L, c, 1) + fine('M13 70L12 76M17 71L16 77', 1.2)) +
      S(P('M33 16Q50 10 67 16L71 44V80H29V44z'), c, dk(c)) +
      S(P('M38 14Q50 22 62 14Q60 9 50 9Q40 9 38 14z'), L, c, 1) +
      S(P('M28 78H72V89H28z'), L, c, 1) + fine('M34 80V87M40 80V87M46 80V87M52 80V87M58 80V87M64 80V87', 1.2) +
      fine('M30 46L35 51L40 46L45 51L50 46L55 51L60 46L65 51L70 46', 2) +
      '<path d="M50 58C47 54 42 57 45 61L50 66L55 61C58 57 53 54 50 58z" fill="' + L + '" stroke-width="1.6"/>' +
      hi(37, 32, 2.4, 6);
  };

  // Veste : courte, ouverte par une fermeture éclair, col montant, poches zippées, bas élastique.
  V.jacket = function (c) {
    var L = lt(c);
    return ground(34, 86) +
      both(S(P('M34 16L19 26L12 74L23 76L30 44z'), c, dk(c))) +

  function tenue(items) {

  function memeTenue(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  // Deux vêtements à des places différentes (la capuche cache la casquette, la robe remplace le bas).
  function compatibles(a, b) {
    var pa = MOT[a].place, pb = MOT[b].place;
    if (pa === pb) return false;
    if ((a === 'hoodie' && pb === 'tete') || (b === 'hoodie' && pa === 'tete')) return false;

    items.push({ h: h1, c: cs[0] });
    if (h2) items.push({ h: h2, c: cs[1] });
    var vrai = items, faux = [];
    // Pièges : les couleurs échangées, un autre vêtement à la même place, une autre couleur.
    if (items.length === 2) faux.push([{ h: items[0].h, c: items[1].c }, { h: items[1].h, c: items[0].c }]);
    var autresH = melange(MOTS.filter(function (m) {
      return m.fiche === 'clothes' && m.place === MOT[h1].place && m.id !== h1 && (!h2 || compatibles(m.id, h2));
    }).map(function (m) { return m.id; }));

      case 'bLecon': return afficherLecon();
      case 'bJouer': case 'bJouerLecon': return lancer('bonus', cartesBonus());
      case 'bParent': return afficherParent();
      case 'bRetour': return retour();
      case 'bReglages': return ouvrirReglages();
      case 'bRecacher': document.querySelectorAll('#vFiche .case').forEach(function (c) { c.classList.remove('leve', 'dis'); }); return taire();
      case 'rFermer': $('#dReglages').close(); if (VUE === 'vAccueil') afficherAccueil(); return;
      case 'rTester': case 'pTester': return testerVoix();
      case 'fFin': return afficherAccueil();
      case 'pZero': return confirmer('Tout recommencer ?', 'Tous les progrès de « Say it! » sur cet appareil seront effacés.', function () {
        PR = {}; J = journalVide(); BO = bonusVide(); sauver(); afficherAccueil();
      });
      case 'cNon': $('#dConfirme').close(); CONFIRME = null; return;
      case 'cOui': { $('#dConfirme').close(); var f2 = CONFIRME; CONFIRME = null; if (f2) f2(); return; }
    }
    if (!Q || VUE !== 'vJeu') return;
    switch (id) {
      case 'jLever': return lever();
      case 'jDit': return reponseA(true);
      case 'jPasEncore': return reponseA(false);
      case 'jCompris': { carteFinie(true); return suivante(); }
      case 'jVerifier': return verifierRange();
      case 'jSuivant': return suivante();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) taire(); });

  /* ---------- Démarrage ---------- */
  appliquerReglages();
  afficherAccueil();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible */ });

  /* ---------- Crochet pour les tests automatiques ---------- */
  // juste() / faux() jouent la carte en cours (bonne ou mauvaise réponse) puis passent à la suivante.
  function jouerCarte(ok) {
    if (!Q || VUE !== 'vJeu') return false;
    var c = Q.c;
    clearTimeout(minuteur);
    if (c.t === 'a') { lever(); reponseA(ok); return true; }
    if (c.t === 'intro') { document.querySelectorAll('#jZone .case').forEach(function (el) { if (!el.classList.contains('leve')) leverIntro(el); }); carteFinie(true); suivante(); return true; }
    if (c.t === 'b' || c.t === 'c') { repondre(ok ? c.id : Q.opts.filter(function (x) { return x !== c.id; })[0]); suivante(); return true; }
    if (c.t === 'd') {
      while (Q.k < Q.seq.length) {
        Q.attend = true; var bon = Q.seq[Q.k];
        repondreD(ok ? bon : c.paire.filter(function (x) { return x !== bon; })[0]);
        clearTimeout(minuteur);
      }
      finD(); suivante(); return true;
    }
    if (c.t === 'range') {
      Q.rep = []; Q.pool = Q.bon.map(function (t, i) { return { t: t, i: i }; });
      if (ok) { Q.rep = Q.pool; Q.pool = []; } else { Q.rep = Q.pool.slice().reverse(); Q.pool = []; }
      rendreEtiquettes(); verifierRange(); suivante(); return true;
    }
    if (c.t === 'qui') { repondreQui(ok ? c.bon : (c.bon + 1) % c.opts.length); suivante(); return true; }
    return false;
  }
  window.__sayit = {
    MOTS: MOTS, JUMEAUX: JUMEAUX, FICHES: FICHES,
    etat: function () {
      return {
        vue: VUE, tour: J.tour,
        carte: Q ? JSON.parse(JSON.stringify(Q.c)) : null, leve: Q ? !!Q.leve : false, fait: Q ? !!Q.fait : false,
        run: RUN ? { mode: RUN.mode, i: RUN.i, n: RUN.cartes.length, etoiles: RUN.etoiles, cartes: RUN.cartes.map(function (c) { return { t: c.t, id: c.id, ids: c.ids, encore: !!c.encore }; }) } : null,
        jour: auj(), sus: nbSus()
      };
    },
    progres: function () { return JSON.parse(JSON.stringify(PR)); },
    journal: function () { return JSON.parse(JSON.stringify(J)); },
    bonus: function () { return JSON.parse(JSON.stringify(BO)); },
    plan: function () { return planJour(); },
    paquet: function () { return nouveauPaquet([]); },
    juste: function () { return jouerCarte(true); },
    faux: function () { return jouerCarte(false); },
    lever: function () { lever(); },
    repondre: function (ok) {   // répond sans passer à la suivante (captures)
      var c = Q.c;
      if (c.t === 'b' || c.t === 'c') return repondre(ok ? c.id : Q.opts.filter(function (x) { return x !== c.id; })[0]);
      if (c.t === 'qui') return repondreQui(ok ? c.bon : (c.bon + 1) % c.opts.length);
      if (c.t === 'a') return lever();
    },
    lancerJour: lancerJour,
    lancer: function (mode, cartes) { lancer(mode, cartes); },
    cartesBonus: cartesBonus,
    groupe: groupe, etiquettes: etiquettes, phraseTenue: phraseTenue, carteQui: carteQuiFabrique,
    decaler: function (n) { DECALAGE = n; afficherAccueil(); },
    accueil: afficherAccueil, fiche: afficherFiche, bonusVue: afficherBonus, lecon: afficherLecon, parent: afficherParent,
    dits: function () { return DITS.slice(); },
    voix: function () { choisirVoix(); return VOIX ? { name: VOIX.name, lang: VOIX.lang } : null; }
  };
})();
</script>
<!-- Compteur de visites anonyme (GoatCounter) : compte seulement les ouvertures de la page,
     sans cookie, sans nom, sans rien sur la progression. Hors connexion, rien n'est envoyé.
     Pour ne pas compter un appareil : ouvrir une fois l'adresse avec #sans-compteur à la fin
     (#avec-compteur pour annuler). -->
<script>
(function () {
  try {
    var cle = 'marc.sans-compteur';
    try {
      if (location.hash === '#sans-compteur') localStorage.setItem(cle, 'oui');
      if (location.hash === '#avec-compteur') localStorage.removeItem(cle);
      if (/^#(sans|avec)-compteur$/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
      if (localStorage.getItem(cle) === 'oui') return;
    } catch (e) {}
    if (location.hostname !== 'lechampdelaurore-boop.github.io' || navigator.webdriver || !navigator.onLine || !navigator.sendBeacon) return;
    var q = 'p=' + encodeURIComponent(location.pathname) +
      '&t=' + encodeURIComponent(document.title) +
      '&r=' + encodeURIComponent(document.referrer) +
      '&s=' + encodeURIComponent(screen.width + ',' + screen.height + ',' + (window.devicePixelRatio || 1)) +
      '&rnd=' + Math.random().toString(36).slice(2);
    navigator.sendBeacon('https://lechampdelaurore.goatcounter.com/count?' + q);
  } catch (e) {}
})();
</script>
